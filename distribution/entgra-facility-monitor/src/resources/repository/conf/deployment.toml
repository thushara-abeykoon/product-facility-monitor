[[event_handler]]
name="userPostSelfRegistration"
subscriptions=["POST_ADD_USER"]

[service_provider]
sp_name_regex = "^[\\sa-zA-Z0-9._-]*$"

[database.local]
url = "jdbc:h2:./repository/database/WSO2CARBON_DB;DB_CLOSE_ON_EXIT=FALSE"

[[event_listener]]
id = "token_revocation"
type = "org.wso2.carbon.identity.core.handler.AbstractIdentityHandler"
name = "org.wso2.is.notification.ApimOauthEventInterceptor"
order = 1
[event_listener.properties]
notification_endpoint = "https://mgt.aq.nbro.gov.lk/internal/data/v1/notify"
username = "${admin.username}"
password = "${admin.password}"
'header.X-WSO2-KEY-MANAGER' = "default"

[oauth.grant_type.token_exchange]
enable = true
allow_refresh_tokens = true
iat_validity_period = "1h"#Use this file to add new common variables. Don't override default deployement.toml properties here.. To override use pom.xml

[database_configuration]
enable_h2_console = "true"

[identity_mgt.endpoint]
enable_self_signup_endpoint = false

[realm_manager.properties]
reserved_tenant_user_username = "reserved_user"
reserved_tenant_user_password = "reserved_user"

[web_app.listener]
class_name = ["io.entgra.device.mgt.core.apimgt.webapp.publisher.lifecycle.listener.APIPublisherLifecycleListener", "io.entgra.device.mgt.core.device.mgt.core.config.permission.lifecycle.WebAppDeploymentLifecycleListener"]

[apim.sync_runtime_artifacts.gateway.skip_list]
apis = ["_TokenAPI_.xml", "_API_Application_Registration_.xml", "health-check.xml"]
sequences = ["_api_registration_fault_.xml"]

[oauth.grant_type.jwt_bearer]
grant_handler="io.entgra.device.mgt.core.device.mgt.oauth.extensions.handlers.grant.ExtendedJWTGrantHandler"

[[oauth.custom_grant_type]]
name="access_token"
grant_handler="io.entgra.device.mgt.core.device.mgt.oauth.extensions.handlers.grant.AccessTokenGrantHandler"
grant_validator="io.entgra.device.mgt.core.device.mgt.oauth.extensions.validators.AccessTokenGrantValidator"

[oauth.token_renewal]
renew_refresh_token=false

[[output_adapter.custom_output_adapter]]
adapter.type = "oauth-mqtt"
[adapter.properties]
minThread = 8
maxThread = 100
keepAliveTimeInMillis = 20000
jobQueueSize = 10000
connectionKeepAliveInterval = 60
dcrUrl = "https://${iot.keymanager.host}:${iot.keymanager.https.port}/client-registration/v0.17/register"
tokenUrl = "https://${iot.gateway.host}:${iot.gateway.https.port}/token"
url = "tcp://${mqtt.broker.host}:${mqtt.broker.port}"
username = "${admin.username}"
password = "${admin.password}"
qos = 2
clearSession = true

[transport.https.properties]
maxHttpHeaderSize="65536"
proxyPort = 443

[transport.http.properties]
maxHttpHeaderSize="32768"
proxyPort = 80

[product_conf]
server_name = "IoT Server"
server_version = "6.1.0.0"
current_year = "2026"

[device_mgt_conf.pull_notification_conf]
enabled=true

[heart_beat_beacon_conf]
enable=true
notifier_initial_delay_in_seconds=30
notifier_frequency_in_seconds=300
time_skew_in_seconds=5
sever_timeout_interval_in_seconds=600

[task_watcher.conf]
enable=true

[oauth.jwt.renew_token_without_revoking_existing]
enable = true
allowed_grant_types = ["client_credentials", "password", "authorization_code", "refresh_token"]


